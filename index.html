<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  
  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Primary Meta Tags -->
  <title>NovaSnap - AI-First Ephemeral Messaging</title>
  <meta name="title" content="NovaSnap - AI-First Ephemeral Messaging" />
  <meta name="description" content="An ephemeral, AI-first messaging experience with stories, memories, and intelligent conversations." />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://novasnap.app/" />
  <meta property="og:title" content="NovaSnap - AI-First Ephemeral Messaging" />
  <meta property="og:description" content="An ephemeral, AI-first messaging experience with stories, memories, and intelligent conversations." />
  <meta property="og:image" content="/logo.png" />
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://novasnap.app/" />
  <meta property="twitter:title" content="NovaSnap - AI-First Ephemeral Messaging" />
  <meta property="twitter:description" content="An ephemeral, AI-first messaging experience with stories, memories, and intelligent conversations." />
  <meta property="twitter:image" content="/logo.png" />
</head>

<body>
  <div id="root"></div>
  
  <!-- Splashscreen HTML statique (avant le chargement de React) -->
  <div id="splash-screen" style="
    position: fixed;
    inset: 0;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    font-family: system-ui, -apple-system, sans-serif;
  ">
    <div style="
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    ">
      <!-- Logo Container -->
      <div style="
        width: 128px;
        height: 128px;
        border-radius: 32px;
        background: linear-gradient(135deg, #FFFC00 0%, #eab308 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(255, 252, 0, 0.4);
        padding: 16px;
        animation: splash-scale 0.6s ease-out;
      ">
        <img 
          src="/logo.png" 
          alt="NovaSnap Logo" 
          style="width: 100%; height: 100%; object-fit: contain;"
        />
      </div>
      
      <!-- App Name -->
      <h1 style="
        font-size: 1.875rem;
        font-weight: 900;
        letter-spacing: -0.025em;
        background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.7) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0;
        animation: splash-fade 0.4s ease-out 0.2s both;
      ">
        NovaSnap
      </h1>
      
      <!-- Loading Spinner -->
      <div style="
        margin-top: 2rem;
        animation: splash-fade 0.5s ease-out 0.6s both;
      ">
        <div style="
          width: 24px;
          height: 24px;
          border: 2px solid rgba(255, 252, 0, 0.2);
          border-top-color: #FFFC00;
          border-radius: 50%;
          animation: splash-spin 0.8s linear infinite;
        "></div>
      </div>
    </div>
  </div>
  
  <style>
    @keyframes splash-scale {
      from {
        transform: scale(0.5);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
    
    @keyframes splash-fade {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes splash-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  
  <script>
    // Masquer le splashscreen une fois que React est chargé
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.style.opacity = '0';
          splash.style.transition = 'opacity 0.3s ease-out';
          setTimeout(() => splash.remove(), 300);
        }
      }, 100);
    });
  </script>
  
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
