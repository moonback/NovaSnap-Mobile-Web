<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>NovaSnap — Hors connexion</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0f;
      color: #f7f8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .bg-glow::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 252, 0, 0.08) 0%, transparent 70%);
      border-radius: 50%;
    }

    .bg-glow::after {
      content: '';
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.05) 0%, transparent 70%);
      border-radius: 50%;
    }

    .container {
      text-align: center;
      padding: 2rem;
      z-index: 1;
      max-width: 400px;
    }

    .icon-container {
      width: 100px;
      height: 100px;
      margin: 0 auto 2rem;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255, 252, 0, 0.15), rgba(255, 252, 0, 0.05));
      border: 1px solid rgba(255, 252, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 3s ease-in-out infinite;
    }

    .wifi-icon {
      width: 48px;
      height: 48px;
      opacity: 0.6;
    }

    .wifi-icon svg {
      stroke: #FFC0CB;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(180deg, #fff 0%, rgba(255, 255, 192, 203.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: rgba(255, 255, 192, 203.45);
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: #FFC0CB;
      color: #000;
      border: none;
      border-radius: 16px;
      font-size: 0.875rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 24px rgba(255, 252, 0, 0.25);
    }

    .retry-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 32px rgba(255, 252, 0, 0.4);
    }

    .retry-btn:active {
      transform: translateY(0);
    }

    .status {
      margin-top: 2.5rem;
      padding: 12px 20px;
      background: rgba(255, 255, 192, 203.05);
      border: 1px solid rgba(255, 255, 192, 203.08);
      border-radius: 12px;
      font-size: 0.75rem;
      color: rgba(255, 255, 192, 203.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }
  </style>
</head>

<body>
  <div class="bg-glow"></div>
  <div class="container">
    <div class="icon-container">
      <div class="wifi-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <line x1="1" y1="1" x2="23" y2="23" stroke="#FFC0CB" stroke-width="2" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
    </div>

    <h1>Hors connexion</h1>
    <p>
      Tu n'es pas connecté à Internet.<br />
      Vérifie ta connexion et réessaie.
    </p>

    <button class="retry-btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
      Réessayer
    </button>

    <div class="status">
      <div class="pulse-dot"></div>
      En attente de connexion…
    </div>
  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>

</html>
